[project]
name = "ko-bert-alignment-test"
version = "0.1.0"
description = "klue/roberta-large tokenizer alignment test for Style-Bert-VITS2 Korean BERT integration"
requires-python = "==3.12.*"
dependencies = [
    "transformers==4.51.3",
    "torch==2.8.0",          # CPU only — tokenizer 테스트만 수행, CUDA 불필요
    "numpy==1.26.4",
    "tabulate==0.9.0",
    "g2pk2>=0.0.3",          # g2pk2 발음 변환 (음절 수 보존 특성 활용)
    "eunjeon>=0.4.0",        # Windows g2pk2가 요구하는 MeCab 래퍼
    "setuptools<70",         # eunjeon이 pkg_resources 사용 → 70+ 에서 제거됨
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.uv]
# torch PyPI 버전 (Style-Bert-VITS2는 cu128 인덱스, 여기선 CPU)
# GPU가 필요하다면 아래 주석 해제
# [[tool.uv.index]]
# name = "pytorch-cu128"
# url = "https://download.pytorch.org/whl/cu128"
# explicit = true
# [tool.uv.sources]
# torch = { index = "pytorch-cu128" }
